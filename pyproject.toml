[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tokennexus-ai"
version = "0.1.0"
description = "Governed, provider-neutral AI request orchestration contracts."
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.11.9",
    "rfc8785==0.1.4",
    "uuid6==2025.0.1",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tokennexus"]

[tool.hatch.build.targets.sdist]
include = [
    "/docs/architecture",
    "/src/tokennexus",
    "/tests",
    "/README.md",
    "/requirements.txt",
    "/test.py",
]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
